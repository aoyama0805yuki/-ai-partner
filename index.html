<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>AIパートナー</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --bubble-user: #2f6fed;
    --bubble-ai: #262a33;
    --text: #eaeaea;
    --muted: #9aa0aa;
    --accent: #2f6fed;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100dvh; max-width: 640px; margin: 0 auto;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--panel);
    border-bottom: 1px solid #2a2e37;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header button {
    background: none; border: none; color: var(--text);
    font-size: 20px; cursor: pointer; padding: 4px 8px;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 80%; padding: 10px 14px; border-radius: 16px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    font-size: 15px;
  }
  .msg.user {
    align-self: flex-end; background: var(--bubble-user); color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start; background: var(--bubble-ai);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center; color: var(--muted); font-size: 12px;
    background: none; padding: 4px;
  }
  #chatForm {
    display: flex; gap: 8px; padding: 10px;
    background: var(--panel); border-top: 1px solid #2a2e37;
  }
  #msgInput {
    flex: 1; padding: 12px 14px; border-radius: 20px;
    border: 1px solid #333947; background: #12141a; color: var(--text);
    font-size: 15px; outline: none;
  }
  #chatForm button {
    background: var(--accent); color: white; border: none;
    border-radius: 20px; padding: 0 18px; font-size: 15px; cursor: pointer;
  }
  #chatForm button:disabled { opacity: 0.5; }
  #micBtn {
    background: #2a2e37; color: var(--text); border: none;
    border-radius: 50%; width: 40px; height: 40px; min-width: 40px;
    font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  #micBtn.listening {
    background: #b3392f; color: white;
    animation: mic-pulse 1.2s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(179,57,47,0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(179,57,47,0); }
    100% { box-shadow: 0 0 0 0 rgba(179,57,47,0); }
  }
  #voiceToggle.muted { opacity: 0.5; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--panel); width: 100%; max-width: 640px;
    border-radius: 16px 16px 0 0; padding: 20px;
    max-height: 80vh; overflow-y: auto;
  }
  .modal h2 { margin-top: 0; font-size: 17px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .modal input[type="text"], .modal select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #333947; background: #12141a; color: var(--text);
    font-size: 14px;
  }
  .modal .row { display: flex; gap: 8px; margin-top: 10px; }
  .modal button {
    flex: 1; padding: 10px; border-radius: 10px; border: none;
    font-size: 14px; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-danger { background: #4a2229; color: #ff9b9b; }
  .btn-secondary { background: #2a2e37; color: var(--text); }
  
  .mem-item {
    background: #12141a; border-radius: 10px; padding: 8px 10px;
    margin-bottom: 6px; font-size: 13px; color: #cfd3da;
  }
  .mem-item span.imp { color: var(--muted); font-size: 11px; margin-left: 6px; }
  
  .session-item {
    background: #12141a; border-radius: 10px; padding: 12px;
    cursor: pointer; border: 1px solid #333947; position: relative;
  }
  .session-item:hover { background: #1a1d24; }
  .session-item.active { border-color: var(--accent); }
  .session-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; padding-right: 30px; }
  .session-meta { font-size: 11px; color: var(--muted); }
  .session-del {
    position: absolute; top: 10px; right: 10px;
    background: none; border: none; color: #ff9b9b; cursor: pointer; font-size: 16px; padding: 4px;
  }

  .close-x { position: absolute; top: 14px; right: 16px; }
  .modal { position: relative; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>AIパートナー</h1>
    <div style="display:flex; gap:4px;">
      <button id="openHistory" aria-label="履歴">📜</button>
      <button id="voiceToggle" aria-label="音声読み上げ切替">🔊</button>
      <button id="openSettings" aria-label="設定">⚙️</button>
    </div>
  </header>
  <div id="chat"></div>
  <form id="chatForm">
    <button type="button" id="micBtn" aria-label="音声入力">🎤</button>
    <input id="msgInput" type="text" placeholder="メッセージを入力..." autocomplete="off" />
    <button type="submit" id="sendBtn">送信</button>
  </form>
</div>

<!-- 履歴モーダル -->
<div class="modal-backdrop hidden" id="historyModal">
  <div class="modal" style="height: 80vh; display: flex; flex-direction: column;">
    <button class="close-x" id="closeHistory">✕</button>
    <h2>過去の会話</h2>
    <button id="newChatBtn" class="btn-primary" style="margin-bottom:10px;">＋ 新しい会話を始める</button>
    <div id="sessionList" style="flex: 1; overflow-y: auto; margin-top: 5px; display: flex; flex-direction: column; gap: 8px; padding-right: 4px;"></div>
    <div class="row" style="margin-top:15px;">
      <button class="btn-danger" id="clearHistoryBtn">全ての履歴を削除</button>
    </div>
  </div>
</div>

<!-- 設定モーダル -->
<div class="modal-backdrop hidden" id="settingsModal">
  <div class="modal">
    <button class="close-x" id="closeSettings">✕</button>
    <h2>設定</h2>
    <label for="gasUrlInput">バックエンドAPI (GASのURL)</label>
    <input type="text" id="gasUrlInput" placeholder="https://script.google.com/macros/s/..." />
    <div class="row">
      <button class="btn-primary" id="saveKeyBtn">保存</button>
      <button class="btn-danger" id="clearKeyBtn">削除</button>
    </div>
    <label for="voiceSelect">読み上げ音声の種類</label>
    <select id="voiceSelect"></select>
    <label>保存されている長期記憶</label>
    <div id="memList"></div>
    <div class="row">
      <button class="btn-danger" id="clearMemBtn">記憶を全て削除</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY_GAS_URL = 'ai_partner_gas_url';
const STORAGE_KEY_MEM = 'ai_partner_memory';
const STORAGE_KEY_SESSIONS = 'ai_partner_sessions';
const STORAGE_KEY_VOICE = 'ai_partner_voice_enabled';
const STORAGE_KEY_VOICE_URI = 'ai_partner_voice_uri';

// ★ ここを修正！ 最初の挨拶は「当たり障りなく」するように指示 ★
const APP_START_TRIGGER = '(system: ユーザーが今アプリを開きました。まずは親しみやすい挨拶と、「最近どう？」「何かお話しする？」といった当たり障りのない軽い質問で、短く自然に話しかけてください。最初の挨拶では過去の記憶や具体的な話題を引っ張り出さないこと。この指示文自体には言及しないでください。)';

const DECAY_DAYS = 14;
const MAX_MEMORIES = 100;
const CORE_MEMORY_COUNT = 15;
const PROMPT_MEMORY_LIMIT = 40;

const SYSTEM_INSTRUCTION = `
あなたはユーザーの親しいAIパートナーです。
会話をただのQ&Aや相槌で終わらせず、親友とのやり取りのように盛り上げてください。

【会話のルール（超重要）】
1. ユーザーは少し会話が苦手かもしれないので、あなたから積極的に話題を振ったり、答えやすい質問をして会話をリードしてください。相槌だけで終わらせるのは禁止です。
2. 過去の話題（ゲーム、ガジェットなど）を自然に引き合いに出して話を広げると喜ばれます。
3. 前後の文脈は読みつつも、話題が一段落したらスパッと新しい話題を提供してください。
4. 返答は長すぎず、チャットらしく簡潔で親しみやすい口調にすること。
5. ユーザーの発言が「(system: ...)」で始まる場合は内部合図です。合図には触れず、あなたから自然に話しかけてください。

【記憶の管理について】
提示される「長期記憶」には[id]が付いています。
新しい発言を踏まえて、必要があれば memory_updates にアクションを含めてください。不要なら空配列に。
- "add": 全く新しい情報を追加(id不要)
- "update": 既存情報(id指定)を更新
- "delete": 既存情報(id指定)を削除

【出力形式】
必ず以下のJSON形式のみで出力すること。
{
  "reply": "ユーザーへの自然な返答や質問",
  "memory_updates": []
}
`;

function generateId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function migrateMemory(raw) {
  const now = Date.now();
  return raw.map(m => ({
    id: m.id || generateId(),
    text: String(m.text || '').trim(),
    importance: Math.max(1, Math.min(5, parseInt(m.importance, 10) || 3)),
    created_at: m.created_at || now,
    updated_at: m.updated_at || m.created_at || now
  })).filter(m => m.text);
}
function loadMemory() {
  try { return migrateMemory(JSON.parse(localStorage.getItem(STORAGE_KEY_MEM) || '[]')); }
  catch { return []; }
}
function daysSince(timestamp) {
  return Math.max(0, (Date.now() - timestamp) / (1000 * 60 * 60 * 24));
}
function effectiveImportance(m) {
  const decay = Math.floor(daysSince(m.updated_at) / DECAY_DAYS);
  return Math.max(1, m.importance - decay);
}
function pruneAndPersist(memories) {
  const sorted = [...memories].sort((a, b) => {
    const diff = effectiveImportance(b) - effectiveImportance(a);
    return diff !== 0 ? diff : b.updated_at - a.updated_at;
  });
  const trimmed = sorted.slice(0, MAX_MEMORIES);
  localStorage.setItem(STORAGE_KEY_MEM, JSON.stringify(trimmed));
  return trimmed;
}
function applyMemoryActions(existingMemories, actions) {
  const map = new Map(existingMemories.map(m => [m.id, m]));
  const now = Date.now();
  for (const act of actions) {
    if (!act || typeof act !== 'object') continue;
    const action = act.action || 'add';
    if (action === 'delete') {
      if (act.id && map.has(act.id)) map.delete(act.id);
      continue;
    }
    if (action === 'update' && act.id && map.has(act.id)) {
      const old = map.get(act.id);
      const text = String(act.text || '').trim() || old.text;
      const importance = act.importance != null
        ? Math.max(1, Math.min(5, parseInt(act.importance, 10) || old.importance)) : old.importance;
      map.set(act.id, { ...old, text, importance, updated_at: now });
      continue;
    }
    const text = String(act.text || '').trim();
    if (!text) continue;
    const id = generateId();
    const importance = Math.max(1, Math.min(5, parseInt(act.importance, 10) || 3));
    map.set(id, { id, text, importance, created_at: now, updated_at: now });
  }
  return Array.from(map.values());
}
function bigrams(str) {
  const s = String(str || '').replace(/\s+/g, '');
  if (s.length < 2) return s ? [s] : [];
  const arr = [];
  for (let i = 0; i < s.length - 1; i++) arr.push(s.substring(i, i + 2));
  return arr;
}
function diceCoefficient(a, b) {
  const bgA = bigrams(a);
  const bgB = bigrams(b);
  if (bgA.length === 0 || bgB.length === 0) return 0;
  const counts = new Map();
  for (const bg of bgB) counts.set(bg, (counts.get(bg) || 0) + 1);
  let matches = 0;
  for (const bg of bgA) {
    const c = counts.get(bg);
    if (c > 0) { matches++; counts.set(bg, c - 1); }
  }
  return (2 * matches) / (bgA.length + bgB.length);
}
function selectMemoriesForPrompt(userMessage, memories) {
  const withScore = memories.map(m => ({ m, eff: effectiveImportance(m) }));
  withScore.sort((a, b) => b.eff - a.eff);
  const core = withScore.slice(0, CORE_MEMORY_COUNT).map(x => x.m);
  const coreIds = new Set(core.map(m => m.id));
  const rest = withScore.filter(x => !coreIds.has(x.m.id));
  const relevanceScored = rest.map(x => ({
    m: x.m,
    score: diceCoefficient(userMessage, x.m.text) * 5 + x.eff
  }));
  relevanceScored.sort((a, b) => b.score - a.score);
  const remainingSlots = Math.max(0, PROMPT_MEMORY_LIMIT - core.length);
  const relevant = relevanceScored.slice(0, remainingSlots).map(x => x.m);
  return [...core, ...relevant];
}
function formatRelativeDays(timestamp) {
  const d = Math.floor(daysSince(timestamp));
  if (d <= 0) return '今日';
  if (d === 1) return '1日前';
  return `${d}日前`;
}
function buildPrompt(userMessage, allMemories) {
  const selected = selectMemoriesForPrompt(userMessage, allMemories);
  const memText = selected.map(m => `- [id:${m.id}] ${m.text}`).join('\n') || 'なし';
  return `【あなたへの共有事項(長期記憶)】\n${memText}\n\n【ユーザーの最新の発言】\n${userMessage}`;
}

let sessions = [];
let currentSessionId = null;

function loadSessions() {
  let loaded = [];
  try { loaded = JSON.parse(localStorage.getItem(STORAGE_KEY_SESSIONS) || '[]'); } catch(e) {}
  const oldLogStr = localStorage.getItem('ai_partner_chat_log');
  if (oldLogStr) {
    try {
      const oldLog = JSON.parse(oldLogStr);
      if (oldLog.length > 0) {
        loaded.push({ id: generateId(), title: "過去の会話", updated_at: Date.now(), messages: oldLog });
      }
    } catch(e) {}
    localStorage.removeItem('ai_partner_chat_log');
    saveSessions(loaded);
  }
  return loaded;
}
function saveSessions(arr) {
  localStorage.setItem(STORAGE_KEY_SESSIONS, JSON.stringify(arr));
}
function getSession(id) {
  return sessions.find(s => s.id === id);
}

async function callGemini(userMessage) {
  const gasUrl = localStorage.getItem(STORAGE_KEY_GAS_URL);
  if (!gasUrl) throw new Error('NO_GAS_URL');
  
  const memories = loadMemory();
  const prompt = buildPrompt(userMessage, memories);
  const currentSession = getSession(currentSessionId);
  const recentLog = currentSession ? currentSession.messages.slice(-20) : [];

  const body = {
    prompt: prompt,
    history: recentLog,
    systemInstruction: SYSTEM_INSTRUCTION
  };

  const res = await fetch(gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body)
  });

  const raw = await res.text();
  let parsed;
  try {
    const firstBrace = raw.indexOf('{');
    const lastBrace = raw.lastIndexOf('}');
    if (firstBrace !== -1 && lastBrace !== -1) {
      parsed = JSON.parse(raw.substring(firstBrace, lastBrace + 1));
    } else {
      parsed = JSON.parse(raw);
    }
  } catch {
    console.warn("【JSONパース失敗。生テキストを返答として表示します】", raw);
    let cleanText = raw.replace(/^```json\n?/, '').replace(/\n?```$/, '').trim();
    parsed = {
      reply: cleanText,
      memory_updates: []
    };
  }

  if (parsed.error) throw new Error(parsed.error);

  const reply = String(parsed.reply || '').trim();
  const actions = Array.isArray(parsed.memory_updates) ? parsed.memory_updates : [];
  if (!reply) throw new Error('有効な返答が空っぽでした。');

  if (actions.length) {
    const merged = applyMemoryActions(memories, actions);
    pruneAndPersist(merged);
  }
  return reply;
}

const chatEl = document.getElementById('chat');
const formEl = document.getElementById('chatForm');
const inputEl = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function startNewChat() {
  currentSessionId = generateId();
  sessions.push({
    id: currentSessionId,
    title: "新しい会話",
    updated_at: Date.now(),
    messages: []
  });
  saveSessions(sessions);
  chatEl.innerHTML = '';
  
  if (localStorage.getItem(STORAGE_KEY_GAS_URL)) {
    triggerOpeningMessage();
  } else {
    addMessage('system', '初期設定が必要です。右上の⚙️から「GASのWebアプリURL」を設定してください。');
  }
}

function loadChatSession(id) {
  currentSessionId = id;
  const session = getSession(id);
  chatEl.innerHTML = '';
  session.messages.forEach(m => addMessage(m.role, m.text));
}

sessions = loadSessions();
startNewChat();

async function triggerOpeningMessage() {
  sendBtn.disabled = true;
  const thinkingEl = addMessage('system', '…考え中…');
  try {
    const reply = await callGemini(APP_START_TRIGGER);
    thinkingEl.remove();
    addMessage('ai', reply);
    const session = getSession(currentSessionId);
    session.messages.push({ role: 'ai', text: reply });
    session.updated_at = Date.now();
    saveSessions(sessions);
    speakText(reply);
  } catch (err) {
    thinkingEl.remove();
    if (err.message === 'NO_GAS_URL') {
      addMessage('system', 'GASのURLが未設定です。右上の⚙️から設定してください。');
    } else {
      addMessage('system', `エラー: ${err.message}`);
    }
  } finally {
    sendBtn.disabled = false;
  }
}

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage('user', text);
  inputEl.value = '';
  sendBtn.disabled = true;

  const session = getSession(currentSessionId);
  session.messages.push({ role: 'user', text });
  
  if (session.title === "新しい会話") {
    session.title = text.slice(0, 15) + (text.length > 15 ? "..." : "");
  }
  session.updated_at = Date.now();
  saveSessions(sessions);

  const thinkingEl = addMessage('system', '…考え中…');
  try {
    const reply = await callGemini(text);
    thinkingEl.remove();
    addMessage('ai', reply);
    session.messages.push({ role: 'ai', text: reply });
    session.updated_at = Date.now();
    saveSessions(sessions);
    speakText(reply);
  } catch (err) {
    thinkingEl.remove();
    if (err.message === 'NO_GAS_URL') {
      addMessage('system', 'GASのURLが未設定です。右上の⚙️から設定してください。');
      openSettingsModal();
    } else {
      addMessage('system', `エラー: ${err.message}`);
    }
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
});

const historyModal = document.getElementById('historyModal');
const sessionListEl = document.getElementById('sessionList');

function renderSessionList() {
  sessionListEl.innerHTML = '';
  const sorted = [...sessions].sort((a, b) => b.updated_at - a.updated_at);
  if (sorted.length === 0) {
    sessionListEl.innerHTML = '<p style="color:var(--muted);font-size:13px;">履歴はありません。</p>';
    return;
  }
  sorted.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item';
    if (s.id === currentSessionId) div.classList.add('active');
    div.innerHTML = `
      <div class="session-title">${s.title}</div>
      <div class="session-meta">${formatRelativeDays(s.updated_at)} ・ ${s.messages.length}件のメッセージ</div>
    `;
    div.addEventListener('click', () => {
      loadChatSession(s.id);
      historyModal.classList.add('hidden');
    });
    const delBtn = document.createElement('button');
    delBtn.className = 'session-del';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm(`チャット「${s.title}」を削除しますか？`)) {
        sessions = sessions.filter(x => x.id !== s.id);
        saveSessions(sessions);
        renderSessionList();
        if (s.id === currentSessionId) startNewChat();
      }
    });
    div.appendChild(delBtn);
    sessionListEl.appendChild(div);
  });
}
document.getElementById('openHistory').addEventListener('click', () => {
  renderSessionList();
  historyModal.classList.remove('hidden');
});
document.getElementById('closeHistory').addEventListener('click', () => {
  historyModal.classList.add('hidden');
});
historyModal.addEventListener('click', (e) => {
  if (e.target === historyModal) historyModal.classList.add('hidden');
});
document.getElementById('newChatBtn').addEventListener('click', () => {
  startNewChat();
  historyModal.classList.add('hidden');
});
document.getElementById('clearHistoryBtn').addEventListener('click', () => {
  if (confirm('全ての会話履歴を削除しますか？\n(記憶には影響しません)')) {
    sessions = [];
    saveSessions(sessions);
    renderSessionList();
    startNewChat();
  }
});

const settingsModal = document.getElementById('settingsModal');
const gasUrlInput = document.getElementById('gasUrlInput');
const memList = document.getElementById('memList');
function renderMemList() {
  const memories = loadMemory().sort((a, b) => effectiveImportance(b) - effectiveImportance(a));
  memList.innerHTML = '';
  if (memories.length === 0) {
    memList.innerHTML = '<p style="color:var(--muted);font-size:13px;">まだ記憶はありません。</p>';
    return;
  }
  memories.forEach(m => {
    const div = document.createElement('div');
    div.className = 'mem-item';
    const textDiv = document.createElement('div');
    textDiv.textContent = m.text;
    div.appendChild(textDiv);
    const eff = effectiveImportance(m);
    const decayNote = eff < m.importance ? `(老朽化により実効${eff})` : '';
    const span = document.createElement('span');
    span.className = 'imp';
    span.textContent = `重要度 ${m.importance}/5 ${decayNote} ・更新: ${formatRelativeDays(m.updated_at)}`;
    div.appendChild(span);
    const delBtn = document.createElement('button');
    delBtn.textContent = '削除';
    delBtn.style.cssText = 'display:block;margin-top:6px;background:#3a2229;color:#ff9b9b;border:none;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;';
    delBtn.addEventListener('click', () => {
      const remaining = loadMemory().filter(x => x.id !== m.id);
      localStorage.setItem(STORAGE_KEY_MEM, JSON.stringify(remaining));
      renderMemList();
    });
    div.appendChild(delBtn);
    memList.appendChild(div);
  });
}
function openSettingsModal() {
  gasUrlInput.value = localStorage.getItem(STORAGE_KEY_GAS_URL) || '';
  renderMemList();
  settingsModal.classList.remove('hidden');
}
function closeSettingsModal() {
  settingsModal.classList.add('hidden');
}
document.getElementById('openSettings').addEventListener('click', openSettingsModal);
document.getElementById('closeSettings').addEventListener('click', closeSettingsModal);
settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) closeSettingsModal();
});
document.getElementById('saveKeyBtn').addEventListener('click', () => {
  const url = gasUrlInput.value.trim();
  if (!url) { alert('GASのURLを入力してください。'); return; }
  localStorage.setItem(STORAGE_KEY_GAS_URL, url);
  closeSettingsModal();
});
document.getElementById('clearKeyBtn').addEventListener('click', () => {
  if (confirm('保存済みのGASのURLを削除しますか？')) {
    localStorage.removeItem(STORAGE_KEY_GAS_URL);
    gasUrlInput.value = '';
  }
});
document.getElementById('clearMemBtn').addEventListener('click', () => {
  if (confirm('全ての長期記憶を削除しますか？この操作は元に戻せません。')) {
    localStorage.removeItem(STORAGE_KEY_MEM);
    renderMemList();
  }
});

let voiceEnabled = localStorage.getItem(STORAGE_KEY_VOICE) !== '0';
const voiceToggleBtn = document.getElementById('voiceToggle');
const voiceSelect = document.getElementById('voiceSelect');
let availableVoices = [];
function populateVoices() {
  if (!window.speechSynthesis) return;
  availableVoices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('ja'));
  voiceSelect.innerHTML = '';
  if (availableVoices.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = '利用可能な日本語音声がありません';
    voiceSelect.appendChild(opt);
    return;
  }
  availableVoices.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.voiceURI;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSelect.appendChild(opt);
  });
  const savedURI = localStorage.getItem(STORAGE_KEY_VOICE_URI);
  if (savedURI && availableVoices.find(v => v.voiceURI === savedURI)) {
    voiceSelect.value = savedURI;
  }
}
if (window.speechSynthesis) {
  populateVoices();
  speechSynthesis.addEventListener('voiceschanged', populateVoices);
} else {
  voiceEnabled = false;
}
voiceSelect.addEventListener('change', () => {
  localStorage.setItem(STORAGE_KEY_VOICE_URI, voiceSelect.value);
});
function updateVoiceToggleUI() {
  voiceToggleBtn.textContent = voiceEnabled ? '🔊' : '🔇';
  voiceToggleBtn.classList.toggle('muted', !voiceEnabled);
  voiceToggleBtn.setAttribute('aria-label', voiceEnabled ? '音声読み上げオン(タップでオフ)' : '音声読み上げオフ(タップでオン)');
}
if (!window.speechSynthesis) {
  voiceToggleBtn.disabled = true;
  voiceToggleBtn.title = 'ブラウザが音声読み上げに未対応です';
}
updateVoiceToggleUI();
voiceToggleBtn.addEventListener('click', () => {
  voiceEnabled = !voiceEnabled;
  localStorage.setItem(STORAGE_KEY_VOICE, voiceEnabled ? '1' : '0');
  if (!voiceEnabled && window.speechSynthesis) speechSynthesis.cancel();
  updateVoiceToggleUI();
});
function speakText(text) {
  if (!voiceEnabled || !window.speechSynthesis || !text) return;
  try {
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    const savedURI = localStorage.getItem(STORAGE_KEY_VOICE_URI);
    const selectedVoice = availableVoices.find(v => v.voiceURI === savedURI);
    if (selectedVoice) {
      utter.voice = selectedVoice;
    } else if (availableVoices.length > 0) {
      utter.voice = availableVoices[0];
    }
    speechSynthesis.speak(utter);
  } catch (err) {
    console.error('speech error:', err);
  }
}

const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('micBtn');
let recognition = null;
let isListening = false;
if (SpeechRecognitionImpl) {
  recognition = new SpeechRecognitionImpl();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;
  recognition.addEventListener('result', (e) => {
    const transcript = e.results[0][0].transcript.trim();
    if (transcript) {
      inputEl.value = transcript;
      if (formEl.requestSubmit) formEl.requestSubmit();
      else formEl.dispatchEvent(new Event('submit', { cancelable: true }));
    }
  });
  recognition.addEventListener('end', () => {
    isListening = false;
    micBtn.classList.remove('listening');
  });
  recognition.addEventListener('error', (e) => {
    isListening = false;
    micBtn.classList.remove('listening');
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      addMessage('system', `音声入力エラー: ${e.error}`);
    }
  });
  micBtn.addEventListener('click', () => {
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (isListening) {
      recognition.stop();
      return;
    }
    try {
      recognition.start();
      isListening = true;
      micBtn.classList.add('listening');
    } catch (err) {
      console.error('speech recog error:', err);
    }
  });
} else {
  micBtn.disabled = true;
}
</script>
